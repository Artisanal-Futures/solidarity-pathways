build:
  gpu: true
  base_image: "paddlecloud/paddledetection:2.4-gpu-cuda11.2-cudnn8-latest"
  python_packages:
    - "requests==2.31.0"
  run:
    - "mkdir -p /opt/paddle/PaddleDetection/output_inference"
    - "cd /opt/paddle/PaddleDetection && python tools/export_model.py -c configs/mot/centertrack/centertrack_hrnet_w18_256x192.yml -o weights=https://paddledet.bj.bcebos.com/models/mot/centertrack_hrnet_w18_256x192.pdparams"

predict: "predict.py:predict"