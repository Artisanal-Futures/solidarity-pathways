build:
  gpu: true
  python_version: "3.9"
  python_packages:
    - "paddlepaddle-gpu==2.6.0"
    - "opencv-python==4.8.1.78"
    - "numpy==1.23.5"
    - "requests==2.31.0"
    - "pyyaml==6.0.1"
    - "pillow==10.0.1"
    - "numba==0.56.4"
    - "scikit-learn==1.3.0"
  system_packages:
    - "ffmpeg"
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
    - "wget"
    - "curl"
  # https://github.com/PaddlePaddle/Knover/issues/12
  # note: warning slow download speeds!
  run:
    - "git clone --branch v2.8.1 https://github.com/PaddlePaddle/PaddleDetection.git /opt/paddle/PaddleDetection"
    - "cd /opt/paddle/PaddleDetection && pip install -r requirements.txt"
    - "cd /opt/paddle/PaddleDetection && python setup.py install"
    - "mkdir -p /opt/paddle/PaddleDetection/output_inference"
    # Step 1: Export the original detection model for ByteTrack with retry logic
    - "cd /opt/paddle/PaddleDetection && for i in 1 2 3; do python tools/export_model.py -c configs/mot/bytetrack/detector/ppyoloe_crn_l_36e_640x640_mot17half.yml -o weights=https://paddledet.bj.bcebos.com/models/mot/ppyoloe_crn_l_36e_640x640_mot17half.pdparams --output_dir=output_inference/mot_detector && break || (echo 'Attempt $i failed, retrying...' && sleep 10); done"
    # Step 2: Export the Re-ID model for feature extraction (long-term memory) with retry logic
    - "cd /opt/paddle/PaddleDetection && for i in 1 2 3; do python tools/export_model.py -c configs/mot/deepsort/reid/deepsort_pplcnet.yml -o reid_weights=https://paddledet.bj.bcebos.com/models/mot/deepsort/deepsort_pplcnet.pdparams --output_dir=output_inference/reid_model && break || (echo 'Attempt $i failed, retrying...' && sleep 10); done"

predict: "predict.py:predict"